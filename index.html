<style>
/* Layout: airy warm page, a sunrise-coloured progress card on top, bills as friendly cards with a pastel initial per category; ink-navy actions, fresh teal for progress. */
:root{
  --bg:#f7f4ee; --surface:#ffffff; --sunk:#efebe3; --line:#e4dfd4;
  --fg:#1f2a44; --muted:#6c7080; --accent:#1f8a70; --accent-ink:#ffffff; --accent-soft:#dcf2ea; --action:#1f2a44; --action-ink:#ffffff;
  --ok:#3b6ea5; --ok-soft:#e3edf8;
  --good:#1f8a70; --good-soft:#dcf2ea; --warn:#a0690f; --warn-soft:#fbefd6; --bad:#c0582f; --bad-soft:#fde7dc;
  --calm:#6c7080; --calm-soft:#efebe3;
  --sun1:#ffe9d2; --sun2:#e6f0fb;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --r:18px; --nav:64px;
}
:root,:root[data-theme="dark"]{color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.n{font-variant-numeric:tabular-nums;white-space:nowrap}
h1,h2,h3{font-family:var(--f-display);font-weight:800;margin:0;text-wrap:balance;letter-spacing:-.015em}
h2{font-size:1.35rem} h3{font-size:1.05rem}
.muted{color:var(--muted)} .small{font-size:.85rem}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{padding-block:22px 4px}
header .wrap{display:flex;align-items:center;gap:12px}
header h1{font-size:1.6rem;display:flex;align-items:center;gap:8px}
header .sub{font-size:.9rem;color:var(--muted)}
.iconbtn{border:0;background:var(--sunk);border-radius:50%;width:44px;height:44px;display:grid;place-items:center;margin-left:auto;color:var(--muted);font-size:1.3rem}
.iconbtn:disabled{opacity:.35}

main .wrap{display:flex;flex-direction:column;gap:16px;padding-block:8px calc(var(--nav) + 120px + env(safe-area-inset-bottom,0px))}
.banner{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:.88rem}

.hero{background:linear-gradient(135deg,var(--sun1),var(--sun2));color:var(--fg);border-radius:24px;padding:20px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.hero > div{display:flex;flex-direction:column;gap:2px;min-width:0}
.ring{width:96px;height:96px;flex:none}
.ring text{font-family:var(--f-display);font-weight:800}
.hero .lbl{font-size:.9rem;color:var(--muted)}
.hero .big{font-family:var(--f-display);font-size:2rem;font-weight:800;line-height:1.1}
.hero .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
@media (max-width:380px){.hero{grid-template-columns:1fr}.ring{width:80px;height:80px}}
.hero .chip{background:rgba(255,255,255,.7);border-radius:99px;padding:3px 11px;font-size:.84rem;font-weight:600}

.actions{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.act{border:0;border-radius:99px;padding:16px 12px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:1rem;min-height:60px}
.act.main{background:var(--action);color:var(--action-ink)}
.act.alt{background:var(--surface);box-shadow:0 2px 10px rgba(31,42,68,.08)}

.chips{display:flex;gap:8px;overflow-x:auto}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 15px;font-weight:600;font-size:.9rem;white-space:nowrap;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.cards{display:flex;flex-direction:column;gap:8px}
.bill{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;min-height:70px}
.bill{border-color:transparent;box-shadow:0 2px 10px rgba(31,42,68,.06)}
.bill.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--accent-soft)}
.pick{border:0;background:var(--av,#ece7dd);border-radius:50%;width:42px;height:42px;display:grid;place-items:center;padding:0;color:#2b2f3a;font-family:var(--f-display);font-weight:800;font-size:1.05rem;transition:transform .15s}
.pick:active{transform:scale(.92)}
.pick .ck{display:none}
.bill.sel .pick{background:var(--accent);color:var(--accent-ink)}
.bill.sel .pick .ck{display:grid}.bill.sel .pick .ini{display:none}
.pick svg{width:20px;height:20px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.pick svg{width:16px;height:16px;stroke-width:3}
.bill .body{min-width:0;cursor:pointer}
.bill .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bill .when{font-size:.85rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px}
.bill .amt{font-weight:700;text-align:right}
.tag{font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.t-bad{background:var(--bad-soft);color:var(--bad)} .t-warn{background:var(--warn-soft);color:var(--warn)}
.t-ok{background:var(--ok-soft);color:var(--ok)} .t-calm{background:var(--calm-soft);color:var(--calm)} .t-good{background:var(--good-soft);color:var(--good)}
.totalrow{display:flex;justify-content:space-between;padding:6px 6px 0;font-weight:700}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--fg);font-size:1.05rem}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:700;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.primary{background:var(--action);border-color:var(--action);color:var(--action-ink)}
.btn.dark{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.btn.link{border:0;background:none;color:var(--accent);padding:4px 0}
.btn.danger{color:var(--bad);border-color:var(--bad);background:none}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}

.selbar{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px));z-index:8}
.selbar .wrap{padding-block:0 10px}
.selbar .box{background:var(--fg);color:var(--bg);border-radius:18px;padding:12px 12px 12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.selbar .sum{font-weight:700;font-size:1.1rem}
.selbar .cnt{font-size:.8rem;opacity:.75}
.selbar .btn{padding:10px 12px;font-size:.92rem}
.selbar .btn.on-dark{background:var(--bg);color:var(--fg);border-color:var(--bg)}
.selbar .btn.ghost{background:none;color:var(--bg);border-color:var(--muted)}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabbar .wrap{display:grid;grid-template-columns:repeat(3,1fr);height:var(--nav)}
nav.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.75rem;font-weight:600;color:var(--muted);position:relative}
nav.tabbar button[aria-selected="true"]{color:var(--accent)}
nav.tabbar .dotn{position:absolute;top:6px;left:calc(50% + 8px);background:var(--bad-soft);color:var(--bad);font-weight:700;border-radius:99px;font-size:.68rem;min-width:18px;line-height:18px;padding:0 5px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio div{display:flex;flex-direction:column;min-width:0}
.trio .v{font-weight:700;font-size:1.05rem}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav b{font-family:var(--f-display);font-size:1.15rem}
.monthnav .iconbtn{margin:0;background:var(--sunk);color:var(--fg)}
.cat{display:grid;grid-template-columns:minmax(0,120px) 1fr auto;gap:10px;align-items:center;font-size:.9rem}
.cat .tr{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.cat .fl{height:100%;background:var(--ok);border-radius:5px}
.cat .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx{display:grid;grid-template-columns:46px 1fr auto;gap:10px;padding:10px 2px;border-top:1px solid var(--line);align-items:center;cursor:pointer}
.tx .d{font-size:.8rem;color:var(--muted)}
.tx .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .c{font-size:.78rem;color:var(--muted)}
.tx .a.plus{color:var(--good)}
.search{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;width:100%}
.save{font-family:var(--f-display);font-size:2.4rem;font-weight:800;color:var(--good);line-height:1.05}
.tip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.tip .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tip p{margin:0;font-size:.9rem;color:var(--muted)}
.abo{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.abo .ops{grid-column:1/-1;display:flex;gap:8px}
.abo .ops button{border:1px solid var(--line);background:none;border-radius:99px;padding:5px 14px;font-size:.85rem;font-weight:600}
.abo .ops button[aria-pressed="true"].k{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.abo .ops button[aria-pressed="true"].x{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.abo.gone .an{text-decoration:line-through;color:var(--muted)}
.ai{white-space:pre-wrap;font-size:.95rem;line-height:1.55}

.overlay{position:fixed;inset:0;z-index:20;background:rgba(8,14,13,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.overlay{align-items:center}.sheet{border-radius:22px}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 0;flex:none}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.82rem;font-weight:700;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;width:100%;font-size:1rem}
.field input.err{border-color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.toggle{display:flex;gap:12px;align-items:center;font-weight:600;padding:4px 0}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
details{border:1px solid var(--line);border-radius:12px;padding:0 14px}
details summary{padding:12px 0;font-weight:700;cursor:pointer}
details[open]{padding-bottom:14px}
details .inner{display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem}
.kv > span:nth-child(odd){color:var(--muted)}
.bigamt{font-family:var(--f-display);font-size:2rem;font-weight:800}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.oklist{display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.oklist div{display:flex;justify-content:space-between;gap:10px}
.qrbox{background:#fff;border-radius:12px;padding:14px;align-self:center;width:min(300px,100%)}
.qrbox svg{width:100%;height:auto;display:block}
.radio{display:flex;flex-direction:column;gap:8px}
.radio label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.radio input{margin-top:3px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:30;background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:.9rem;font-weight:600;max-width:calc(100% - 32px);text-align:center}
.live{position:fixed;inset:0;z-index:36;background:#000;display:flex;flex-direction:column}
.live video{flex:1;width:100%;height:100%;object-fit:cover;min-height:0}
.live .frame{position:absolute;left:50%;top:44%;width:min(80vw,420px);aspect-ratio:210/297;max-height:72vh;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 100vmax rgba(0,0,0,.3)}
.live .livebar{background:var(--surface);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;text-align:center}
.lock{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,var(--sun1),var(--sun2) 60%,var(--bg));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));text-align:center}
.lock h2{font-size:1.4rem}
.dots{display:flex;gap:14px;height:18px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--fg);display:block}
.dots i.on{background:var(--fg)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{width:72px;height:72px;border-radius:50%;border:0;background:rgba(255,255,255,.85);font-family:var(--f-display);font-size:1.6rem;font-weight:800;color:var(--fg);box-shadow:0 2px 8px rgba(31,42,68,.08)}
.pad button.plain{background:none;box-shadow:none;font-family:var(--f-body);font-size:.78rem;font-weight:600;padding:0}
.busy{position:fixed;inset:0;z-index:35;background:rgba(247,244,238,.85);display:grid;place-items:center;padding:24px}
.busy .bx{background:var(--surface);border-radius:20px;padding:22px 24px;box-shadow:0 10px 30px rgba(31,42,68,.15);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;max-width:320px}
.busy .spin{width:30px;height:30px;border-width:3px;color:var(--accent)}
.busy b{font-size:1.05rem}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>

<header><div class="wrap">
  <div><h1 id="hello">Hallo Danijel</h1><div class="sub" id="today"></div></div>
  <button class="iconbtn" id="settings" style="background:var(--surface);color:var(--fg);box-shadow:0 2px 8px rgba(31,42,68,.08)" aria-label="Einstellungen"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
</div></header>

<main><div class="wrap" id="view"></div></main>

<div class="selbar" id="selbar" hidden><div class="wrap"><div class="box">
  <div style="min-width:0"><div class="sum n" id="selsum"></div><div class="cnt" id="selcnt"></div></div>
  <span style="flex:1"></span>
  <button class="btn ghost" id="sel-paid">Bezahlt</button>
  <button class="btn on-dark" id="sel-ubs">An UBS</button>
</div></div></div>

<nav class="tabbar"><div class="wrap" role="tablist">
  <button role="tab" data-tab="bills" aria-selected="true"><svg class="i" viewBox="0 0 24 24"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>Rechnungen<span class="dotn" id="badge" hidden></span></button>
  <button role="tab" data-tab="konto" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><path d="M3 10l9-6 9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18"/></svg>Konto</button>
  <button role="tab" data-tab="spar" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><path d="M19 9c1 .5 2 1.5 2 3h-1.5c-.3 1.4-1.1 2.6-2.2 3.5V19h-3v-2h-4v2h-3v-3.3A6 6 0 0 1 4 11c0-3.3 3.1-6 7-6 1.5 0 2.9.4 4 1l3-1v4z"/></svg>Sparen</button>
</div></nav>

<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>
<div class="live" id="live" hidden><video id="livev" playsinline muted></video><div class="frame"></div>
  <div class="livebar"><b id="liveT">Ganze Rechnung ins Bild halten</b><span class="small muted">Ich lese QR-Code, Fälligkeit und Mahnung auf einmal.</span><div class="btnrow"><button class="btn" id="live-photo">Foto statt Live</button><button class="btn dark" id="live-stop">Abbrechen</button></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
"use strict";
const IN_CLAUDE = !!(window.claude && window.claude.use);
const APP_VERSION = "12";
if (!IN_CLAUDE){
  try{ const l = document.createElement("link"); l.rel = "manifest"; l.href = "manifest.webmanifest"; document.head.appendChild(l);
    if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){}
}
/* ===== basics ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NF = new Intl.NumberFormat("de-CH",{minimumFractionDigits:2,maximumFractionDigits:2});
const chf = n => "CHF " + NF.format(Math.round((+n||0)*100)/100);
const chf0 = n => "CHF " + new Intl.NumberFormat("de-CH",{maximumFractionDigits:0}).format(Math.round(+n||0));
const pad = n => String(n).padStart(2,"0");

/* ===== Swiss payment helpers ===== */
const cleanIban = s => String(s||"").replace(/\s+/g,"").toUpperCase();
function ibanOK(s){ const i = cleanIban(s); if (!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(i)) return false; if (/^(CH|LI)/.test(i) && i.length !== 21) return false;
  const r = (i.slice(4)+i.slice(0,4)).replace(/[A-Z]/g, c => c.charCodeAt(0)-55); let m = 0; for (const ch of r) m = (m*10 + +ch) % 97; return m === 1; }
const isQrIban = s => { const i = cleanIban(s); const iid = +i.slice(4,9); return /^(CH|LI)/.test(i) && iid >= 30000 && iid <= 31999; };
function qrrOK(s){ const r = String(s||"").replace(/\s/g,""); if (!/^\d{27}$/.test(r)) return false; const T=[0,9,4,6,8,2,7,1,3,5]; let c=0; for (let i=0;i<26;i++) c = T[(c + +r[i]) % 10]; return (10-c)%10 === +r[26]; }
function scorOK(s){ const r = String(s||"").replace(/\s/g,"").toUpperCase(); if (!/^RF\d{2}[A-Z0-9]{1,21}$/.test(r)) return false; const x = (r.slice(4)+r.slice(0,4)).replace(/[A-Z]/g, c => c.charCodeAt(0)-55); let m=0; for (const ch of x) m=(m*10 + +ch)%97; return m===1; }
const fmtIban = s => cleanIban(s).replace(/(.{4})/g,"$1 ").trim();
function refType(b){ const r = String(b.ref||"").replace(/\s/g,""); if (qrrOK(r)) return "QRR"; if (scorOK(r)) return "SCOR"; return "NON"; }
function payProblems(b){
  const p = [];
  if (!ibanOK(b.iban)) p.push("IBAN fehlt oder stimmt nicht");
  else if (isQrIban(b.iban) && refType(b) !== "QRR") p.push("QR-Referenz fehlt oder stimmt nicht");
  if (!b.town) p.push("Ort des Empfängers fehlt");
  if (!(b.amount > 0)) p.push("Betrag fehlt");
  return p;
}
const bankDay = s => { const d = parseIso(s).getDay(); return d===6 ? addDays(s,2) : d===0 ? addDays(s,1) : s; };
function latestPayDay(due){ let d = addDays(due,-2); const w = parseIso(d).getDay(); if (w===0) d = addDays(d,-2); if (w===6) d = addDays(d,-1); return d; }
function execDate(b, mode){ const asap = bankDay(TODAY); if (mode === "asap") return asap; const l = latestPayDay(b.due); return l < asap ? asap : l; }
function parseSPC(text){
  const L = String(text||"").split(/\r?\n/); if (L[0] !== "SPC" || L.length < 29) return null;
  let street = L[6]||"", nr = L[7]||"", zip = L[8]||"", town = L[9]||"";
  if (L[4] === "K"){ nr = ""; const m = (L[7]||"").match(/^(\S+)\s+(.*)$/); zip = m ? m[1] : ""; town = m ? m[2] : (L[7]||""); }
  const q = { iban:L[3], creditor:L[5], street, nr, zip, town, ctry:L[10]||"CH", amount: L[18] ? +L[18] : 0, ref: L[27]==="NON" ? "" : (L[28]||""), msg: L[29]||"" };
  const s1 = String(L[31]||""); // //S1/10/RechnungsNr/11/YYMMDD/.../40/0:30
  if (s1.startsWith("//S1/")){
    const f = {}; const parts = s1.slice(5).split("/"); for (let i=0;i+1<parts.length;i+=2) f[parts[i]] = parts[i+1];
    if (/^\d{6}/.test(f["11"]||"")){ const d = f["11"], is = "20"+d.slice(0,2)+"-"+d.slice(2,4)+"-"+d.slice(4,6);
      if (isDate(is)){
        q.issue = is;
        const net = String(f["40"]||"").split(";").map(x => x.split(":")).find(x => x.length === 2 && x[0] !== "" && +x[0] === 0 && /^\d{1,3}$/.test(x[1]));
        if (net) q.due = addDays(is, +net[1]);
      }
    }
    if (f["10"]) q.invoiceNo = f["10"];
  }
  return q;
}

function guessCat(text, isCredit){
  const t = String(text||"");
  if (/kontoübertrag|kontouebertrag|umbuchung/i.test(t)) return "Umbuchung";
  if (isCredit) return "Einnahmen";
  for (const r of st.settings.rules) if (r.m && t.toLowerCase().includes(r.m)) return r.c;
  for (const [re,c] of KW) if (re.test(t)) return c;
  return "Sonstiges";
}

function fromDocs(entries){
  const bills = {}, months = {}; let settings = DEF_SETTINGS();
  for (const [id,raw] of entries){
    if (!raw) continue;
    const data = JSON.parse(JSON.stringify(raw)); // snapshots are frozen – work on a copy
    if (id.startsWith("b_")) bills[id.slice(2)] = data;
    else if (id.startsWith("m_")) months[id.slice(2)] = data;
    else if (id === "settings") settings = Object.assign(DEF_SETTINGS(), data);
  }
  st.settings = settings;
  for (const b of Object.values(bills)) if (!isDate(b.due)){ b.due = addDays(isDate(b.added) ? b.added : TODAY, 30); b.dueGuess = true; }
  if (!Object.keys(bills).length && !Object.keys(months).length) loadDemo();
  else { st.demo = false; st.bills = bills; st.months = months; }
}
function writeDoc(id, data){
  if (st.demo) return Promise.resolve();
  if (store.mode === "db"){
    const prev = store.chain[id] || Promise.resolve();
    const next = prev.catch(()=>{}).then(() => data === null ? store.col.doc(id).delete() : store.col.doc(id).set(data))
      .catch(e => toast(e && e.code === "quota_exceeded" ? "Speicher voll – alte Monate löschen." : "Speichern hat nicht geklappt (" + ((e && e.code) || "Fehler") + "). Bitte nochmals."));
    return (store.chain[id] = next);
  }
  if (store.mode === "local"){ try{ const all = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); if (data === null) delete all[id]; else all[id] = data; localStorage.setItem(LS_KEY, JSON.stringify(all)); }catch(e){} }
  return Promise.resolve();
}
const saveBill = b => { st.bills[b.id] = b; return writeDoc("b_"+b.id, b); };
const delBill = id => { delete st.bills[id]; return writeDoc("b_"+id, null); };
const saveMonth = k => writeDoc("m_"+k, st.months[k]);

function leaveDemo(){ if (!st.demo) return; st.demo = false; st.bills = {}; st.months = {}; delete st.settings.balances["Beispielkonto"]; ui.sel.clear(); ui.month = null; }
function autoArchive(){
  if (st.demo) return; const cur = monKey(TODAY); let n = 0;
  for (const b of Object.values(st.bills)) if (b.status === "paid" && b.paidAt && monKey(b.paidAt) < cur){ b.status = "archived"; b.archiveMonth = monKey(b.paidAt); saveBill(b); n++; }
  if (n) toast(n + (n===1 ? " bezahlte Rechnung" : " bezahlte Rechnungen") + " ins Archiv gelegt");
}
async function boot(){

  if (db && id){
    store.mode = "db"; store.col = db.collection("data/users/" + id);
    let first = true; const timer = setTimeout(()=>toast("Deine Daten sind gerade nicht erreichbar."), 10000);
    store.col.onSnapshot(snap => {
      fromDocs(snap.docs.map(d => [d.id, d.data()]));
      if (!snap.metadata.fromCache){ clearTimeout(timer); if (first){ first = false; autoArchive(); } }

  } else {
    store.mode = "local"; let all = {}; try{ all = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); }catch(e){}

/* ===== bill logic ===== */
function billState(b){
  const d = daysUntil(b.due);
  if (d < 0) return {k:"bad", label: d===-1 ? "seit gestern fällig" : "seit "+(-d)+" Tagen fällig", rank:0};
  if (d === 0) return {k:"bad", label:"heute fällig", rank:0};
  if (b.reminder) return {k:"bad", label:"Mahnung", rank:0};
  if (d <= 7) return {k:"warn", label: d===1 ? "morgen" : "in "+d+" Tagen", rank:1};
  if (d <= 30) return {k:"ok", label:"in "+d+" Tagen", rank:2};
  return {k:"calm", label:"kann warten", rank:3};
}
const allTx = () => Object.values(st.months).flatMap(m => m.items || []);
function findPayment(b){
  const name = normKey(b.creditor).split(" ")[0];
  return allTx().find(t => t.amt < 0 && Math.abs(-t.amt - b.amount) < 0.06 && t.date >= addDays(b.added || TODAY,-3) && (!name || (t.name+" "+t.text).toLowerCase().includes(name)));
}
function balance(){ const b = Object.values(st.settings.balances || {}); return b.length ? b.reduce((s,x)=>s+(+x.amt||0),0) : null; }
const openBills = () => Object.values(st.bills).filter(b => b.status === "open");

function viewBills(){
  const open = openBills().sort((a,b) => (billState(a).rank===0 ? 0 : 1) - (billState(b).rank===0 ? 0 : 1) || a.due.localeCompare(b.due) || b.amount - a.amount);
  const now = new Date(), endMonth = iso(new Date(now.getFullYear(), now.getMonth()+1, 0));
  const dueSoon = open.filter(b => b.due <= endMonth || billState(b).rank === 0);

/* ===== UBS payment file (pain.001.001.09, Swiss Payment Standards) ===== */
const xe = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c]));
const swiftTxt = (s, n) => String(s||"").normalize("NFC").replace(/[^A-Za-z0-9ÀÁÂÄÇÈÉÊËÌÍÎÏÑÒÓÔÖÙÚÛÜßàáâäçèéêëìíîïñòóôöùúûü .,:'+&\-\/()?]/g," ").replace(/\s+/g," ").trim().slice(0,n);
function buildPain(bills, mode){
  const now = new Date(), msgId = "FO" + now.getTime().toString(36).toUpperCase();
  const byDate = {}; bills.forEach(b => (byDate[execDate(b,mode)] ||= []).push(b));
  const total = bills.reduce((s,b)=>s+b.amount,0), p = st.settings.payer;
  let x = `<?xml version="1.0" encoding="UTF-8"?>\n<Document xmlns="urn:iso:std:iso:20022:tech:xsd:pain.001.001.09" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="urn:iso:std:iso:20022:tech:xsd:pain.001.001.09 pain.001.001.09.ch.03.xsd">\n<CstmrCdtTrfInitn>\n`;
  x += `<GrpHdr><MsgId>${msgId}</MsgId><CreDtTm>${iso(now)}T${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}</CreDtTm><NbOfTxs>${bills.length}</NbOfTxs><CtrlSum>${total.toFixed(2)}</CtrlSum><InitgPty><Nm>${xe(swiftTxt(p.name,70))}</Nm></InitgPty></GrpHdr>\n`;
  let pi = 0;
  for (const [date, list] of Object.entries(byDate).sort()){
    pi++;
    x += `<PmtInf><PmtInfId>${msgId}-${pi}</PmtInfId><PmtMtd>TRF</PmtMtd><BtchBookg>false</BtchBookg><NbOfTxs>${list.length}</NbOfTxs><CtrlSum>${list.reduce((s,b)=>s+b.amount,0).toFixed(2)}</CtrlSum>`;
    x += `<ReqdExctnDt><Dt>${date}</Dt></ReqdExctnDt><Dbtr><Nm>${xe(swiftTxt(p.name,70))}</Nm></Dbtr><DbtrAcct><Id><IBAN>${cleanIban(p.iban)}</IBAN></Id></DbtrAcct><DbtrAgt><FinInstnId><BICFI>UBSWCHZH80A</BICFI></FinInstnId></DbtrAgt>\n`;
    list.forEach((b, i) => {
      const rt = refType(b), ref = String(b.ref||"").replace(/\s/g,"").toUpperCase(), e2e = (msgId + "-" + pi + "-" + (i+1)).slice(0,35);
      const adr = [b.street?`<StrtNm>${xe(swiftTxt(b.street,70))}</StrtNm>`:"", b.nr?`<BldgNb>${xe(swiftTxt(b.nr,16))}</BldgNb>`:"", b.zip?`<PstCd>${xe(swiftTxt(b.zip,16))}</PstCd>`:"", `<TwnNm>${xe(swiftTxt(b.town,35))}</TwnNm>`, `<Ctry>${(b.ctry||"CH").toUpperCase().slice(0,2)}</Ctry>`].join("");
      const rmt = rt === "QRR" ? `<Strd><CdtrRefInf><Tp><CdOrPrtry><Prtry>QRR</Prtry></CdOrPrtry></Tp><Ref>${ref}</Ref></CdtrRefInf></Strd>`
        : rt === "SCOR" ? `<Strd><CdtrRefInf><Tp><CdOrPrtry><Cd>SCOR</Cd></CdOrPrtry></Tp><Ref>${ref}</Ref></CdtrRefInf></Strd>`
        : `<Ustrd>${xe(swiftTxt(b.msg || b.ref || b.note || "Rechnung " + fmtD(b.due), 140))}</Ustrd>`;
      x += `<CdtTrfTxInf><PmtId><InstrId>${e2e}</InstrId><EndToEndId>${e2e}</EndToEndId></PmtId><Amt><InstdAmt Ccy="CHF">${b.amount.toFixed(2)}</InstdAmt></Amt><Cdtr><Nm>${xe(swiftTxt(b.creditor,70))}</Nm><PstlAdr>${adr}</PstlAdr></Cdtr><CdtrAcct><Id><IBAN>${cleanIban(b.iban)}</IBAN></Id></CdtrAcct><RmtInf>${rmt}</RmtInf></CdtTrfTxInf>\n`;
    });
    x += `</PmtInf>\n`;
  }
  return x + `</CstmrCdtTrfInitn>\n</Document>\n`;
}

/* ===== camt import ===== */
function kids(el, name){ return el ? [...el.children].filter(c => c.localName === name) : []; }
function pick(el, path){ let cur = [el]; for (const p of path.split("/")){ cur = cur.flatMap(c => kids(c,p)); if (!cur.length) return null; } return cur[0]; }
const val = (el, path) => { const e = pick(el, path); return e ? e.textContent.trim() : ""; };
function cleanText(s){
  return String(s||"").replace(/\b(debitkarte|debit card|kartenzahlung|einkauf|e-banking[- ]auftrag|e-banking|zahlung|lastschrift|dauerauftrag|gutschrift|belastung|ubs card|maestro|visa debit)\b[\s:-]*/gi," ")
    .replace(/\b\d{2}\.\d{2}\.\d{2,4}\b/g," ").replace(/\b\d{2}:\d{2}(:\d{2})?\b/g," ").replace(/\bkarten?-?nr\.?\s*[\dx*]+/gi," ").replace(/\s+/g," ").trim();
}
function parseCamt(xmlText){
  const doc = new DOMParser().parseFromString(xmlText, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) throw new Error("keine gültige XML-Datei");
  const stmts = [...doc.getElementsByTagNameNS("*","Stmt"), ...doc.getElementsByTagNameNS("*","Ntfctn"), ...doc.getElementsByTagNameNS("*","Rpt")];
  if (!stmts.length) throw new Error("kein camt-Kontoauszug");
  const tx = [], bals = [];
  for (const s of stmts){
    const acct = val(s,"Acct/Id/IBAN") || val(s,"Acct/Id/Othr/Id") || "Konto";
    for (const b of kids(s,"Bal")){ const cd = val(b,"Tp/CdOrPrtry/Cd"); if (["CLBD","ITBD","CLAV"].includes(cd)){ let a = parseFloat(val(b,"Amt")); if (val(b,"CdtDbtInd")==="DBIT") a = -a; bals.push({acct, amt:a, date:(val(b,"Dt/Dt")||val(b,"Dt/DtTm")).slice(0,10)}); } }
    kids(s,"Ntry").forEach((n, ni) => {
      const sts = val(n,"Sts"); if (sts && !/BOOK/.test(sts)) return;
      const credit = val(n,"CdtDbtInd") === "CRDT";
      const date = (val(n,"BookgDt/Dt") || val(n,"BookgDt/DtTm") || val(n,"ValDt/Dt") || val(n,"ValDt/DtTm")).slice(0,10);
      const ntryAmt = parseFloat(val(n,"Amt")) || 0, addl = val(n,"AddtlNtryInf"), ref = val(n,"AcctSvcrRef");
      const details = kids(n,"NtryDtls").flatMap(d => kids(d,"TxDtls"));
      const split = details.length > 1 && details.every(d => parseFloat(val(d,"Amt") || val(d,"AmtDtls/TxAmt/Amt")) > 0);
      const rows = split ? details : [details[0] || null];
      rows.forEach((d, di) => {
        const amt = split ? (parseFloat(val(d,"Amt")) || parseFloat(val(d,"AmtDtls/TxAmt/Amt"))) : ntryAmt;
        const P = credit ? "Dbtr" : "Cdtr";
        const name = d ? (val(d,"RltdPties/"+P+"/Nm") || val(d,"RltdPties/"+P+"/Pty/Nm") || val(d,"RltdPties/Ultmt"+P+"/Nm") || val(d,"RltdPties/Ultmt"+P+"/Pty/Nm")) : "";
        const rmt = d ? [...kids(pick(d,"RmtInf"),"Ustrd").map(e=>e.textContent.trim()), val(d,"RmtInf/Strd/CdtrRefInf/Ref")].filter(Boolean).join(" ") : "";
        const info = d ? val(d,"AddtlTxInf") : "";
        const text = cleanText([rmt, info, addl].filter(Boolean).join(" · ")).slice(0,160);
        const nm = (name || cleanText(info || addl || rmt)).slice(0,70);
        const signed = Math.round((credit ? amt : -amt)*100)/100;
        tx.push({id:hash([acct,date,signed,nm,ref,ni,di].join("|")), date, amt:signed, name:nm, text: text===nm ? "" : text, acct, ref: ref || ""});
      });
    });
  }
  const msgId = (doc.getElementsByTagNameNS("*","MsgId")[0] || {}).textContent || "";
  return {tx, bals, src: msgId || hash(xmlText.slice(0, 20000))};
}
async function importFiles(files){
  const texts = [];
  for (const f of files){
    try{
      if (/\.zip$/i.test(f.name) || f.type.includes("zip")){
        // UBS liefert mehrere Dokumente als ZIP – darin können auch weitere ZIPs liegen
        const walk = async (data, depth) => { const z = await JSZip.loadAsync(data);
          for (const e of Object.values(z.files)){ if (e.dir) continue;
            if (/\.xml$/i.test(e.name)) texts.push([e.name, await e.async("string")]);
            else if (/\.zip$/i.test(e.name) && depth < 3) await walk(await e.async("arraybuffer"), depth + 1); } };
        await walk(f, 0);
      }
      else texts.push([f.name, await f.text()]);
    }catch(e){ toast(`«${f.name}» konnte nicht geöffnet werden.`); }
  }
  if (!texts.length) return;
  let added = 0, dup = 0; const touched = new Set(); let bals = []; const wasDemo = st.demo;
  for (const [name, t] of texts){
    let res; try{ res = parseCamt(t); }catch(e){ toast(`«${name}»: ${e.message}`); continue; }
    leaveDemo(); bals = bals.concat(res.bals);
    // Gleiche Buchung aus einer anderen Datei (z. B. einmalige Umwandlung + tägliche EoD-camt.053) nur einmal übernehmen:
    // gleiche Bank-Referenz + Betrag, sonst gleiches Konto + Buchungstag + Betrag (Anzahl wird abgeglichen).
    const seenKey = {};
    for (const x of res.tx){
      if (!x.date) continue; x.src = res.src;
      const k = monKey(x.date), m = (st.months[k] ||= {items:[]});
      const same = m.items.find(y => y.id === x.id);
      if (same){ // gleiche Buchung nochmals geladen: Texte auffrischen (z. B. neu erkannte Umbuchung), eigene Kategorie behalten
        if (same.text !== x.text || same.name !== x.name){ Object.assign(same, {name:x.name, text:x.text, ref:x.ref, acct:x.acct}); touched.add(k); }
        dup++; continue; }
      if (x.ref && m.items.some(y => y.ref && y.ref === x.ref && y.amt === x.amt && y.src !== x.src)){ dup++; continue; }
      const key = x.date + "|" + x.amt; seenKey[key] = (seenKey[key] || 0) + 1;
      const other = m.items.filter(y => y.src && y.src !== x.src && y.date === x.date && y.amt === x.amt && (!y.acct || !x.acct || y.acct === x.acct)).length;
      if (seenKey[key] <= other){ dup++; continue; }
      m.items.push(x); added++; touched.add(k);
    }
  }
  for (const b of bals){ const cur = st.settings.balances[b.acct]; if (!cur || b.date >= cur.date) st.settings.balances[b.acct] = {amt:b.amt, date:b.date}; }
  if (!st.settings.payer.iban){ const k = bals.map(b=>b.acct).find(ibanOK); if (k) st.settings.payer.iban = k; }
  for (const k of touched) await saveMonth(k);
  if (bals.length || wasDemo) await saveSettings();
  if (touched.size) ui.month = [...touched].sort().pop();
  ui.tab = "konto"; render();
  if (added || dup) toast(`${added} Buchungen geladen` + (dup ? `, ${dup} waren schon da` : ""));
}

  const yearTx = allTx().filter(t => daysUntil(t.date) >= -365);
  const interest = -yearTx.filter(t => t.amt < 0 && /zinsabschluss/i.test(t.name + " " + t.text)).reduce((s,t)=>s+t.amt,0);
  if (bal !== null && bal < 0) add("Konto im Minus", `Kontostand ${chf(bal)}. Für das Minus verrechnet die Bank Zins` + (interest > 0 ? ` – in den letzten 12 Monaten ${chf0(interest)}.` : ".") + " Erst das Konto ausgleichen, dann sparen.", interest, 0);
  const cred = avg["Kredite / Raten"]||0;
  if (cred > 50){
    const per = {}; win.filter(t => t.amt < 0 && txCat(t) === "Kredite / Raten").forEach(t => { const k = (t.name||"").replace(/\*.*$/,"").replace(/\s+(AG|GmbH|SA|AECS).*$/i,"").trim(); per[k] = (per[k]||0) - t.amt/nM; });
    const top = Object.entries(per).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([k,v]) => k + " " + chf0(v)).join(", ");
    add("Kreditkarten & Ratenzahlungen", `Im Schnitt ${chf0(cred)} pro Monat (${top}). Die einzelnen Kreditkarten-Käufe siehst du hier nicht, nur die Monatsrechnung. Wird eine Rechnung nicht ganz bezahlt oder in Raten, kostet der Rest meist 10–14 % Zins.`, 0, 1);
  }
  const rem = openBills().filter(b => b.reminder); if (rem.length) add("Mahnungen zuerst zahlen", `${rem.map(b=>b.creditor).join(", ")} – sonst kommen Mahngebühren dazu.`, rem.length*30, 0);
  tips.sort((a,b)=>a.sev-b.sev || b.save-a.save);
  return {avg, income, spend, rec, tips, nM};
}

async function askAdvisor(){

  const sample = window.claude ? await claude.use("sample") : null; if (!sample){ toast("Geht nur in der Claude-App."); return; }
  const data = `Ø pro Monat (${a.nM} Monate): Einnahmen ${chf0(a.income)}, Ausgaben ${chf0(a.spend)}.
Kategorien: ${Object.entries(a.avg).sort((x,y)=>y[1]-x[1]).map(([k,v])=>k+" "+chf0(v)).join("; ")}.
Feste Kosten: ${a.rec.map(r=>r.name+" "+chf(r.monthly)+"/Mt."+(st.settings.decisions[r.key]==="cancel"?" (will kündigen)":"")).join("; ")||"keine"}.
Offene Rechnungen: ${openBills().map(b=>b.creditor+" "+chf(b.amount)+" fällig "+fmtD(b.due)+(b.reminder?" (Mahnung)":"")).join("; ")||"keine"}.
Kontostand: ${balance()!==null?chf(balance()):"unbekannt"}. Heute: ${fmtD(TODAY)}.`;
  ui.aiBusy = true; ui.aiText = ""; render();
  try{

Gib: 1) die 3 Massnahmen mit dem grössten Sparbetrag pro Jahr (mit CHF), 2) welche offenen Rechnungen zuerst und welche später, 3) ein realistisches monatliches Sparziel. Erfinde keine Zahlen.\n\n${data}`,

document.addEventListener("click", async e => {
  if (e.target === $("#overlay")) { closeSheet(); return; }
  const t = e.target.closest("button,[data-open],[data-tx]"); if (!t) return;
  const D = t.dataset;
  if (D.tab){ ui.tab = D.tab; render(); scrollTo(0,0); return; }
  if (D.goto){ ui.tab = D.goto; render(); return; }
  if (D.folder){ ui.folder = D.folder; render(); return; }
  if (D.sel){ ui.sel.has(D.sel) ? ui.sel.delete(D.sel) : ui.sel.add(D.sel); render(); return; }
  if (D.open){ showBill(D.open); return; }
  if (D.tx){ const tx = (st.months[D.tm].items||[]).find(x => x.id === D.tx); if (tx) txForm(tx); return; }
  if (D.qd){ const i = $("#q-due"); if (i) i.value = addDays(TODAY, +D.qd); return; }
  if (D.mon){ const ks = monthsWithData(), i = ks.indexOf(ui.month) + (+D.mon); if (ks[i]){ ui.month = ks[i]; render(); } return; }
  if (D.dec){ const k = D.dec; if (st.settings.decisions[k] === D.v) delete st.settings.decisions[k]; else st.settings.decisions[k] = D.v; saveSettings(); render(); return; }
  if (D.act){
    const id = D.id;
    if (D.act === "close") closeSheet();
    if (D.act === "paid"){ closeSheet(); markPaid([id]); }
    if (D.act === "reopen"){ const b = st.bills[id]; b.status = "open"; delete b.paidAt; delete b.archiveMonth; saveBill(b); closeSheet(); render(); toast("Wieder offen"); }
    if (D.act === "edit") billForm(st.bills[id]);
    if (D.act === "qr") showQR(id);
    if (D.act === "page"){ pageFor = id; closeSheet(); $("#f-page").click(); }
    if (D.act === "ics") icsFor(id);
    if (D.act === "backup") doBackup();
    if (D.act === "restore") $("#f-restore").click();
    if (D.act === "pinchange"){ closeSheet(); pinScreen("set"); }
    if (D.act === "del"){ if (D.armed){ await delBill(id); closeSheet(); render(); toast("Gelöscht"); } else { t.dataset.armed = "1"; t.textContent = "Sicher? Nochmals tippen"; } }
    return;
  }
  switch (t.id){
    case "b-scan": $("#f-scan").click(); break;
    case "b-cam": if (!IN_CLAUDE && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) liveScan(); else $("#f-cam").click(); break;
    case "live-stop": stopLive(); break;
    case "live-photo": stopLive(); $("#f-cam").click(); break;
    case "b-add": billForm(null); break;
    case "k-import": $("#f-camt").click(); break;
    case "k-toggle": ui.showTx = !ui.showTx; render(); break;
    case "sel-paid": markPaid([...ui.sel]); break;
    case "sel-ubs": ubsSheet(); break;
    case "ubs-make": makeUbsFile(); break;
    case "ubs-done": { const ids = [...ui.sel].filter(id => st.bills[id] && st.bills[id].sentAt === TODAY); closeSheet(); markPaid(ids); break; }
    case "settings": settingsSheet(); break;
    case "ai-go": askAdvisor(); break;
  }
});

  if (f.id === "setform"){

/* ===== PIN lock (standalone app only) ===== */
const PIN_KEY = "finanz-organisator-pin";
const pinGet = () => { try{ return JSON.parse(localStorage.getItem(PIN_KEY) || "null"); }catch(e){ return null; } };
async function pinHash(pin, salt){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt + ":" + pin)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join(""); }
let pinState = null;
function pinScreen(mode){
  pinState = {mode, entry:"", first:"", fails:0, until:0};
  const L = $("#lock"); L.hidden = false;
  const title = mode === "unlock" ? "Gib deine PIN ein" : "Wähle eine 4-stellige PIN";
  const sub = mode === "unlock" ? "Damit nur du deine Finanzen siehst." : "Sie schützt die App, wenn jemand anderes dein Handy hat.";
  L.innerHTML = `<div><h2 id="pinT">${title}</h2><p class="muted" id="pinS" style="margin:6px 0 0">${sub}</p></div>
    <div class="dots" id="pinD">${"<i></i>".repeat(4)}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-pin="${n}">${n}</button>`).join("")}
      <button class="plain" data-pin="forgot">${mode==="unlock"?"Vergessen?":""}</button><button data-pin="0">0</button><button class="plain" data-pin="del" aria-label="Löschen">⌫</button></div>`;
}
function pinDots(){ if (!pinState) return; document.querySelectorAll("#pinD i").forEach((d,i) => d.classList.toggle("on", i < pinState.entry.length)); }
function pinShake(msg){ const d = $("#pinD"); d.classList.remove("shake"); void d.offsetWidth; d.classList.add("shake"); if (msg) $("#pinS").textContent = msg; pinState.entry = ""; setTimeout(pinDots, 300); }
async function pinPress(k){
  const P = pinState; if (!P) return;
  if (k === "del"){ P.entry = P.entry.slice(0,-1); pinDots(); return; }
  if (k === "forgot"){ if (P.mode !== "unlock") return;
    $("#pinT").textContent = "PIN vergessen?";
    $("#pinS").innerHTML = "Die PIN kann niemand zurücksetzen – auch ich nicht. Du kannst die App leeren und danach deine letzte Sicherung laden.<br><br><button class='btn danger' data-pin='wipe'>Alle Daten auf diesem Handy löschen</button>";
    return; }
  if (k === "wipe"){ try{ localStorage.removeItem(LS_KEY); localStorage.removeItem(PIN_KEY); }catch(e){} location.reload(); return; }
  if (Date.now() < P.until){ pinShake("Zu viele Versuche – kurz warten."); return; }
  if (P.checking || P.entry.length >= 4) return;
  P.entry += k; pinDots(); if (P.entry.length < 4) return;
  const val = P.entry;
  if (P.mode === "unlock"){
    P.checking = true; const saved = pinGet();
    const good = saved && await pinHash(val, saved.salt) === saved.hash; P.checking = false;
    if (good){ $("#lock").hidden = true; pinState = null; return; }
    P.fails++; if (P.fails >= 5){ P.until = Date.now() + 30000; P.fails = 0; pinShake("Falsch. Bitte 30 Sekunden warten."); } else pinShake("Falsche PIN – nochmals.");
  } else if (!P.first){ P.first = val; P.entry = ""; setTimeout(pinDots, 150); $("#pinT").textContent = "Nochmals zur Bestätigung"; $("#pinS").textContent = "Gib dieselbe PIN noch einmal ein."; }
  else if (P.first === val){
    P.checking = true; const salt = uid(); try{ localStorage.setItem(PIN_KEY, JSON.stringify({salt, hash: await pinHash(val, salt)})); }catch(e){}
    $("#lock").hidden = true; pinState = null; toast("PIN gespeichert ✓");
  } else { P.first = ""; $("#pinT").textContent = "Wähle eine 4-stellige PIN"; pinShake("Die beiden PINs waren nicht gleich – nochmals."); }
}
document.addEventListener("click", e => { const b = e.target.closest("[data-pin]"); if (b){ e.stopPropagation(); pinPress(b.dataset.pin); } }, true);
document.addEventListener("keydown", e => { if (!pinState) return; if (/^\d$/.test(e.key)) pinPress(e.key); else if (e.key === "Backspace") pinPress("del"); });
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (IN_CLAUDE || !pinGet()) return;
  if (document.hidden) hiddenAt = Date.now(); else if (hiddenAt && Date.now() - hiddenAt > 60000 && !pinState){ stopLive(); closeSheet(); pinScreen("unlock"); }
});
if (!IN_CLAUDE) pinScreen(pinGet() ? "unlock" : "set");
if (!IN_CLAUDE && location.protocol === "https:"){
  const checkUpdate = () => fetch("version.json?t=" + Date.now(), {cache:"no-store"}).then(r => r.json()).then(j => {

      let n = 0; try{ n = +sessionStorage.getItem("fo-upd") || 0; sessionStorage.setItem("fo-upd", n + 1); }catch(e){}
      if (n < 2) location.reload();
    }
  }).catch(()=>{});
  checkUpdate(); document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(); });
}
